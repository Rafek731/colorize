[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colorize"
version = "0.1.0"
description = "Tiny library for coloring terminal text"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/colorize"]
